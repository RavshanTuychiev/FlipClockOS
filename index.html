<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlipClock Study OS</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0d;--bg2:#111113;--bg3:#18181b;--bg4:#202024;--bg5:#28282d;
  --border:#252528;--border2:#303035;
  --text1:#f0f0f2;--text2:#9090a0;--text3:#52525e;
  --accent:#e8e0cc;--accent2:#c8b89a;
  --gold:#d4a843;--gold-dim:#2a220a;--gold-glow:rgba(212,168,67,0.15);
  --red:#e05252;--green:#52c878;--blue:#5294e0;--purple:#9b52e0;--orange:#e07820;
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --sidebar-w:220px;--transition:0.15s ease;
  --shadow:0 2px 12px rgba(0,0,0,0.5);--shadow-lg:0 8px 40px rgba(0,0,0,0.7);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#root{display:flex;height:100vh;overflow:hidden}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:100}
.sidebar-brand{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.brand-icon{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:12px;font-weight:600;letter-spacing:-0.2px;color:var(--text1)}
.brand-sub{font-size:9px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;margin-top:1px}
.sidebar-user{padding:14px 16px;border-bottom:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--accent2);flex-shrink:0}
.user-name{font-size:12px;font-weight:500;color:var(--text1);line-height:1.2}
.user-level{font-size:10px;color:var(--text3);margin-top:1px}
.xp-bar{margin-top:10px}
.xp-bar-track{height:2px;background:var(--border2);border-radius:2px;overflow:hidden}
.xp-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 0.5s ease}
.xp-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:5px}
.sidebar-nav{padding:8px 8px;flex:1}
.nav-section-label{font-size:9px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;padding:8px 8px 4px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text2);cursor:pointer;transition:background var(--transition),color var(--transition);position:relative;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text1)}
.nav-item.active{background:var(--bg4);color:var(--text1)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:12px;background:var(--accent2);border-radius:1px}
.nav-icon{width:15px;height:15px;flex-shrink:0;opacity:0.6;display:flex;align-items:center;justify-content:center}
.nav-item.active .nav-icon,.nav-item:hover .nav-icon{opacity:1}
.nav-badge{margin-left:auto;background:var(--red);color:white;font-size:10px;font-weight:600;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center}
.nav-streak{margin-left:auto;font-size:10px;color:var(--gold);font-weight:500}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.streak-display{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}

/* ===== MAIN CONTENT ===== */
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column}
.topbar{height:48px;min-height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:13px;font-weight:500;color:var(--text1);flex:1}
.topbar-clock{font-family:var(--mono);font-size:12px;color:var(--text2);letter-spacing:1.5px}
.topbar-btn{width:28px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background var(--transition),color var(--transition);cursor:pointer}
.topbar-btn:hover{background:var(--bg4);color:var(--text1)}
.topbar-btn svg{width:13px;height:13px}
.topbar-btn-mobile{display:none}
.page-content{padding:24px;flex:1}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;border:1px solid transparent;transition:all var(--transition);white-space:nowrap;cursor:pointer}
.btn-primary{background:var(--accent);color:#0c0c0d;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text1);border-color:var(--border2)}
.btn-secondary:hover{background:var(--bg4)}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg3);color:var(--text1)}
.btn-danger{background:rgba(224,82,82,0.1);color:var(--red);border-color:rgba(224,82,82,0.3)}
.btn-danger:hover{background:rgba(224,82,82,0.2)}
.btn-icon{padding:8px}
.btn-lg{padding:12px 28px;font-size:14px;border-radius:var(--radius)}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-auth{width:100%;justify-content:center;padding:11px;font-size:14px;border-radius:var(--radius)}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;background:white;color:#1a1a1a;border:1px solid #e0e0e0;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all var(--transition)}
.btn-google:hover{background:#f5f5f5}
.btn-google:disabled{opacity:0.6;cursor:not-allowed}
.btn-google svg{width:20px;height:20px;flex-shrink:0}

/* ===== CARDS ===== */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px}

/* ===== HOME PAGE — PREMIUM REBUILD ===== */
.home-page{display:flex;flex-direction:column;gap:0;min-height:0}

/* Hero */
.home-hero{
  display:grid;
  grid-template-columns:1fr 420px;
  gap:0;
  background:linear-gradient(135deg,var(--bg2) 0%,#0f0f12 100%);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:20px;
  position:relative;
  min-height:320px;
}
.home-hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse 60% 80% at 70% 50%,rgba(212,168,67,0.04) 0%,transparent 70%);
  pointer-events:none;
}
.home-hero-left{
  padding:36px 36px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:0;
  position:relative;
  z-index:1;
}
.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(212,168,67,0.1);
  border:1px solid rgba(212,168,67,0.2);
  border-radius:20px;
  padding:4px 12px;
  font-size:11px;
  color:var(--gold);
  font-weight:500;
  margin-bottom:18px;
  width:fit-content;
}
.hero-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.hero-headline{font-size:34px;font-weight:700;letter-spacing:-1.5px;color:var(--text1);line-height:1.1;margin-bottom:6px}
.hero-headline span{color:var(--gold)}
.hero-sub{font-size:13px;color:var(--text2);line-height:1.65;max-width:360px;margin-bottom:26px;margin-top:8px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hero-btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:8px;
  font-size:13px;font-weight:600;
  background:var(--accent);color:#0c0c0d;
  border:none;cursor:pointer;
  transition:all 0.18s;letter-spacing:0.1px;
}
.hero-btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,224,204,0.2)}
.hero-btn-primary svg{width:13px;height:13px}
.hero-btn-secondary{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:8px;
  font-size:13px;font-weight:500;
  background:transparent;color:var(--text2);
  border:1px solid var(--border2);cursor:pointer;
  transition:all 0.18s;
}
.hero-btn-secondary:hover{background:var(--bg3);color:var(--text1);border-color:var(--border2)}
.hero-btn-secondary svg{width:13px;height:13px}

/* Hero right — clock area */
.home-hero-right{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#0a0a0c 0%,#111115 100%);
  border-left:1px solid var(--border);
}
.home-hero-right::before{
  content:'';
  position:absolute;
  bottom:-30%;left:50%;
  transform:translateX(-50%);
  width:300px;height:300px;
  background:radial-gradient(ellipse,rgba(212,168,67,0.08) 0%,transparent 65%);
  pointer-events:none;
}
.clock-floating-labels{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
}
.clock-label{
  position:absolute;
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:500;
  padding:4px 10px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.03);
  color:var(--text3);
  letter-spacing:0.3px;
  backdrop-filter:blur(8px);
}
.clock-label-top{top:18px;right:16px}
.clock-label-mid{top:50%;right:10px;transform:translateY(-50%) translateX(10px)}
.clock-label-bot{bottom:18px;right:16px}
.clock-label-icon{font-size:11px}

/* Dashboard section */
.home-dash-label{
  font-size:9px;font-weight:500;color:var(--text3);
  letter-spacing:1.5px;text-transform:uppercase;
  text-align:center;
  margin-bottom:14px;
  display:flex;align-items:center;gap:12px;
}
.home-dash-label::before,.home-dash-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Stat cards */
.home-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.home-stat-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
  transition:border-color 0.18s;
}
.home-stat-card:hover{border-color:var(--border2)}
.home-stat-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:14px}
.home-stat-icon.gold{background:var(--gold-dim)}
.home-stat-icon.green{background:rgba(82,200,120,0.1)}
.home-stat-icon.blue{background:rgba(82,148,224,0.1)}
.home-stat-icon.purple{background:rgba(155,82,224,0.1)}
.home-stat-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.9px;margin-bottom:6px;font-weight:500}
.home-stat-value{font-size:26px;font-weight:700;color:var(--text1);letter-spacing:-0.8px;line-height:1}
.home-stat-value.gold{color:var(--gold)}
.home-stat-value.green{color:var(--green)}
.home-stat-sub{font-size:11px;color:var(--text3);margin-top:5px}
.home-stat-bar{margin-top:10px}
.home-stat-bar-track{height:2px;background:var(--bg4);border-radius:2px}
.home-stat-bar-fill{height:100%;border-radius:2px;transition:width 0.5s ease}
.home-stat-bar-fill.gold{background:var(--gold)}
.home-stat-bar-fill.accent{background:var(--accent2)}

/* Next up card + lower grid (reuse existing) */
.next-action-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.na-icon{width:40px;height:40px;background:var(--gold-dim);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.na-icon svg{width:18px;height:18px;color:var(--gold)}
.na-content{flex:1;min-width:0}
.na-label{font-size:9px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:2px}
.na-title{font-size:13px;font-weight:500;color:var(--text1)}
.na-meta{font-size:11px;color:var(--text2);margin-top:2px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ===== STAT GRID (other pages) ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:600;color:var(--text1);letter-spacing:-0.5px;line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}
.stat-card.gold .stat-value{color:var(--gold)}
.stat-card.green .stat-value{color:var(--green)}

/* ===== FLIP CLOCK 2D (fallback + focus page) ===== */
.flip-clock-wrap{display:flex;flex-direction:column;align-items:center;gap:24px}
.flip-clock-body{background:linear-gradient(145deg,#f5f0e8,#e8e0d0);border-radius:22px;padding:30px 40px 26px;box-shadow:0 24px 70px rgba(0,0,0,0.75),inset 0 1px 0 rgba(255,255,255,0.6),0 0 0 2px #ccc0a0;position:relative}
.flip-clock-body::before{content:'';position:absolute;inset:8px;border-radius:15px;border:2px solid #1a1a1a;pointer-events:none;z-index:0}
.flip-clock-digits{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.flip-sep{display:flex;flex-direction:column;gap:16px;margin:0 4px;padding-bottom:10px}
.flip-sep-dot{width:8px;height:8px;border-radius:50%;background:#1a1a1a}
.flip-digit-pair{display:flex;gap:5px}
.flip-digit{width:72px;height:104px;position:relative;border-radius:9px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.6)}
.flip-upper{position:absolute;top:0;left:0;right:0;height:50%;background:#1e1e22;border-radius:9px 9px 0 0;border-bottom:1.5px solid #0a0a0a;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;overflow:hidden;transform-origin:bottom center}
.flip-lower{position:absolute;bottom:0;left:0;right:0;height:50%;background:#252529;border-radius:0 0 9px 9px;border-top:1px solid #3a3a3e;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;overflow:hidden}
.flip-digit-num{font-family:var(--mono);font-size:68px;font-weight:700;color:#e8e4dc;line-height:1;position:absolute;letter-spacing:-3px;text-shadow:0 2px 10px rgba(0,0,0,0.6)}
.flip-upper .flip-digit-num{bottom:-0.01em}
.flip-lower .flip-digit-num{top:-0.01em}
.flip-hinge{position:absolute;top:50%;left:-2px;right:-2px;height:2px;background:#080808;z-index:20;transform:translateY(-50%)}
.flip-hinge::before,.flip-hinge::after{content:'';position:absolute;width:10px;height:10px;background:#2a2a2a;border-radius:50%;top:-4px;box-shadow:0 1px 4px rgba(0,0,0,0.9)}
.flip-hinge::before{left:4px}
.flip-hinge::after{right:4px}
.flip-upper::after{content:'';position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,0.3));pointer-events:none}
.flip-lower::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(rgba(0,0,0,0.25),transparent);pointer-events:none;z-index:1}
@keyframes flipUpperLeave{0%{transform:rotateX(0deg)}100%{transform:rotateX(-90deg)}}
@keyframes flipLowerEnter{0%{transform:rotateX(90deg)}100%{transform:rotateX(0deg)}}
.flip-upper.flipping{animation:flipUpperLeave 0.22s ease-in forwards}
.flip-lower-ghost{position:absolute;bottom:0;left:0;right:0;height:50%;background:#252529;border-radius:0 0 9px 9px;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;overflow:hidden;animation:flipLowerEnter 0.22s ease-out 0.22s forwards;transform:rotateX(90deg);transform-origin:top center;z-index:15}
.flip-lower-ghost .flip-digit-num{top:-0.01em}
.clock-mode-label{font-family:var(--mono);font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:#6a6050;text-align:center;margin-top:12px;position:relative;z-index:1}
.clock-brand{font-size:10px;color:#9a9080;text-align:right;margin-top:2px;letter-spacing:1px;position:relative;z-index:1}

/* ===== FOCUS PAGE — PREMIUM ===== */
.focus-layout{display:grid;grid-template-columns:1fr 288px;gap:28px;align-items:start}
.focus-left{display:flex;flex-direction:column;align-items:center;gap:0}
.mode-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:40px;padding:4px;gap:2px;margin-bottom:28px}
.mode-tab{padding:7px 18px;border-radius:30px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:all 0.18s;letter-spacing:0.2px;white-space:nowrap}
.mode-tab.active{background:var(--bg);color:var(--text1);box-shadow:0 1px 6px rgba(0,0,0,0.5),0 0 0 1px var(--border)}
.mode-tab:hover:not(.active){color:var(--text2)}
.focus-progress-ring{width:100%;max-width:480px;height:2px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-bottom:22px}
.focus-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--gold));border-radius:2px;transition:width 0.5s linear}
.focus-task-card{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.focus-task-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex-shrink:0;box-shadow:0 0 8px rgba(212,168,67,0.6)}
.focus-task-dot.idle{background:var(--border2);box-shadow:none}
.focus-task-text{flex:1;min-width:0}
.focus-task-label{font-size:10px;color:var(--text3);letter-spacing:0.7px;text-transform:uppercase;margin-bottom:3px}
.focus-task-name{font-size:13px;font-weight:500;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus-task-meta{font-size:11px;color:var(--text3);margin-top:2px}
.focus-controls{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.btn-focus-main{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 40px;height:52px;border-radius:26px;font-size:14px;font-weight:600;letter-spacing:0.2px;cursor:pointer;transition:all 0.18s;border:1.5px solid transparent;font-family:var(--font)}
.btn-focus-main.start{background:var(--accent);color:#0c0c0d;border-color:var(--accent)}
.btn-focus-main.start:hover{background:var(--accent2);border-color:var(--accent2);box-shadow:0 4px 20px rgba(232,224,204,0.2);transform:translateY(-1px)}
.btn-focus-main.pause{background:transparent;color:var(--gold);border-color:rgba(212,168,67,0.35)}
.btn-focus-main.pause:hover{background:rgba(212,168,67,0.08)}
.btn-focus-main.resume{background:var(--accent);color:#0c0c0d;border-color:var(--accent)}
.btn-focus-main.resume:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-focus-main svg{width:15px;height:15px}
.btn-focus-icon{width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;transition:all 0.18s;flex-shrink:0}
.btn-focus-icon:hover:not(:disabled){background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.btn-focus-icon:disabled{opacity:0.25;cursor:not-allowed}
.btn-focus-icon svg{width:14px;height:14px}
.focus-stats-bar{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.focus-stat-divider{background:var(--border)}
.focus-stat-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:14px 8px}
.focus-stat-val{font-size:17px;font-weight:600;color:var(--text1);line-height:1}
.focus-stat-label{font-size:10px;color:var(--text3);letter-spacing:0.4px;text-transform:uppercase}
.pom-dots{display:flex;gap:5px;justify-content:center;margin-bottom:1px}
.pom-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:background 0.3s}
.pom-dot.done{background:var(--accent2)}
.pom-dot.active{background:var(--gold);box-shadow:0 0 6px rgba(212,168,67,0.7)}
.focus-right{display:flex;flex-direction:column;gap:12px;position:sticky;top:24px}
.focus-summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.focus-summary-row:last-child{border-bottom:none}
.timer-controls{display:flex;gap:10px;align-items:center}
.timer-task-card{display:none}
.session-stats{display:none}
.sess-stat{display:none}

/* ===== TASKS ===== */
.task-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.task-filters{display:flex;gap:4px;flex-wrap:wrap}
.filter-btn{padding:5px 10px;border-radius:5px;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all var(--transition)}
.filter-btn.active{background:var(--bg4);color:var(--text1);border-color:var(--border2)}
.filter-btn:hover{color:var(--text1)}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:flex-start;gap:12px;transition:border-color var(--transition),background var(--transition)}
.task-item:hover{border-color:var(--border2);background:var(--bg3)}
.task-item.done{opacity:0.5}
.task-checkbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);background:transparent;flex-shrink:0;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;justify-content:center;margin-top:1px}
.task-checkbox:hover{border-color:var(--accent2)}
.task-checkbox.checked{background:var(--accent2);border-color:var(--accent2)}
.task-checkbox.checked svg{display:block}
.task-checkbox svg{display:none;width:10px;height:10px;color:#0c0c0d}
.task-body{flex:1;min-width:0}
.task-title{font-size:13px;color:var(--text1);font-weight:500}
.task-item.done .task-title{text-decoration:line-through;color:var(--text3)}
.task-meta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.task-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.tag-math{background:rgba(82,148,224,0.15);color:var(--blue)}
.tag-eng{background:rgba(82,200,120,0.15);color:var(--green)}
.tag-sci{background:rgba(224,120,32,0.15);color:var(--orange)}
.tag-prog{background:rgba(155,82,224,0.15);color:var(--purple)}
.tag-default{background:var(--bg4);color:var(--text2)}
.task-due{font-size:11px;color:var(--text3)}
.priority-indicator{width:6px;height:6px;border-radius:50%;display:inline-block}
.p-urgent{background:var(--red)}
.p-high{background:var(--orange)}
.p-medium{background:var(--blue)}
.p-low{background:var(--text3)}

/* ===== PROGRESS BARS ===== */
.progress-bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width 0.5s ease}
.progress-fill.gold{background:var(--gold)}
.progress-fill.green{background:var(--green)}
.progress-fill.blue{background:var(--blue)}
.progress-fill.accent{background:var(--accent2)}

/* ===== GOALS ===== */
.goals-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color var(--transition)}
.goal-card:hover{border-color:var(--border2)}
.goal-name{font-size:14px;font-weight:500;color:var(--text1);margin-bottom:4px}
.goal-meta{font-size:11px;color:var(--text2);margin-bottom:10px}
.goal-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:6px}
.goal-milestone{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:12px;color:var(--text2);cursor:pointer}
.goal-milestone.done{color:var(--text3);text-decoration:line-through}

/* ===== HABITS ===== */
.habit-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.habit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.habit-name{font-size:13px;font-weight:500;color:var(--text1)}
.habit-days{display:flex;gap:4px}
.habit-day{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);transition:all 0.15s}
.habit-day.done{background:var(--green);border-color:var(--green);color:#0c0c0d}
.habit-day:hover:not(.done){background:var(--bg3);color:var(--text2)}

/* ===== ANALYTICS ===== */
.analytics-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.chart-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:80px}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.chart-bar{background:var(--bg4);border-radius:3px 3px 0 0;width:100%;transition:height 0.4s ease;min-height:2px}
.chart-bar.active{background:var(--gold)}
.chart-day{font-size:10px;color:var(--text3)}

/* ===== ACTIVITY HEATMAP ===== */
.heatmap-row{display:flex;gap:3px;margin-bottom:3px}
.heatmap-cell{width:12px;height:12px;border-radius:2px;background:var(--bg4);transition:background 0.2s}
.heatmap-cell.l1{background:rgba(212,168,67,0.2)}
.heatmap-cell.l2{background:rgba(212,168,67,0.4)}
.heatmap-cell.l3{background:rgba(212,168,67,0.6)}
.heatmap-cell.l4{background:var(--gold)}

/* ===== ACHIEVEMENTS ===== */
.achievements-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.achievement-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;gap:12px;align-items:flex-start;transition:all var(--transition)}
.achievement-card.unlocked{border-color:rgba(212,168,67,0.25);background:rgba(212,168,67,0.03)}
.achievement-card.locked{opacity:0.45}
.achievement-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--bg3)}
.achievement-name{font-size:12px;font-weight:600;color:var(--text1);margin-bottom:2px}
.achievement-desc{font-size:11px;color:var(--text2)}
.achievement-xp{font-size:10px;color:var(--gold);margin-top:4px;font-weight:500}

/* ===== SETTINGS ===== */
.settings-section{margin-bottom:24px}
.settings-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:13px;color:var(--text1)}
.settings-sub{font-size:11px;color:var(--text3);margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:11px;color:var(--text2);font-weight:500}
.form-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text1);padding:8px 10px;font-size:13px;outline:none;transition:border-color var(--transition);width:100%}
.form-input:focus{border-color:var(--accent2)}
.form-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text1);padding:8px 10px;font-size:13px;outline:none;width:100%}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bg4);border-radius:10px;cursor:pointer;transition:0.3s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--text3);border-radius:50%;transition:0.3s}
.toggle input:checked+.toggle-slider{background:var(--gold)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px);background:var(--bg)}

/* ===== EMPTY STATE ===== */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;gap:8px}
.empty-state svg{width:32px;height:32px;color:var(--text3)}
.empty-state-text{font-size:14px;font-weight:500;color:var(--text2)}
.empty-state-sub{font-size:12px;color:var(--text3)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:440px;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:600;color:var(--text1)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* ===== COMMAND PALETTE ===== */
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding-top:120px;backdrop-filter:blur(4px)}
.cmd-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:480px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.cmd-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:14px 18px;font-size:14px;color:var(--text1);outline:none}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;font-size:13px;color:var(--text2);transition:background var(--transition)}
.cmd-item:hover,.cmd-item.selected{background:var(--bg3);color:var(--text1)}
.cmd-item-icon{width:24px;height:24px;background:var(--bg4);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmd-item-icon svg{width:12px;height:12px}
.cmd-kbd{margin-left:auto;font-size:10px;color:var(--text3);background:var(--bg4);padding:2px 6px;border-radius:4px;font-family:var(--mono)}

/* ===== TOAST ===== */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-lg);pointer-events:all;animation:slideIn 0.3s ease;min-width:220px;max-width:300px}
.toast.gold{border-color:rgba(212,168,67,0.3);background:rgba(212,168,67,0.08)}
.toast.green{border-color:rgba(82,200,120,0.3);background:rgba(82,200,120,0.05)}
.toast-title{font-size:13px;font-weight:500;color:var(--text1)}
.toast-sub{font-size:11px;color:var(--text2);margin-top:2px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}

/* ===== AUTH ===== */
/* Page layout */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;position:relative;overflow:hidden}
.auth-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 20%,rgba(212,168,67,0.04) 0%,transparent 60%);pointer-events:none}
.auth-container{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px;position:relative;z-index:1}
/* Brand */
.auth-brand{display:flex;align-items:center;gap:10px;justify-content:center}
.auth-brand-icon{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-brand-icon svg{width:18px;height:18px;display:block}
.auth-brand-name{font-size:15px;font-weight:600;color:var(--text1);letter-spacing:-0.2px}
/* Card */
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;width:100%}
.auth-header{margin-bottom:22px;text-align:center}
.auth-title{font-size:20px;font-weight:700;color:var(--text1);letter-spacing:-0.5px;margin-bottom:4px}
.auth-subtitle{font-size:13px;color:var(--text2)}
/* Form */
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text1);padding:10px 12px;font-size:13px;outline:none;transition:border-color 0.15s;font-family:inherit}
.auth-input:focus{border-color:var(--border2)}
.auth-input::placeholder{color:var(--text3)}
/* Eye toggle */
.eye-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;padding:2px;display:flex;align-items:center;justify-content:center}
.eye-toggle svg{width:16px;height:16px;display:block}
.eye-toggle:hover{color:var(--text1)}
/* Divider */
.auth-divider{display:flex;align-items:center;gap:10px;margin:2px 0}
.auth-divider-line{flex:1;height:1px;background:var(--border)}
.auth-divider-text{font-size:11px;color:var(--text3)}
/* Footer links */
.auth-footer{text-align:center;font-size:12px;color:var(--text2);margin-top:4px}
.auth-link{background:none;border:none;color:var(--accent2);font-size:inherit;cursor:pointer;padding:0;font-family:inherit}
.auth-link:hover{text-decoration:underline}
/* Error */
.auth-error{display:flex;align-items:center;gap:8px;background:rgba(224,82,82,0.08);border:1px solid rgba(224,82,82,0.25);border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;color:var(--red);line-height:1.4}
.auth-error svg{width:14px;height:14px;flex-shrink:0;display:block}
/* Google button */
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:white;color:#1a1a1a;border:1px solid #e0e0e0;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn-google:hover{background:#f5f5f5}
.btn-google:disabled{opacity:0.6;cursor:not-allowed}
.btn-google svg{width:18px;height:18px;flex-shrink:0;display:block}
/* Forgot link */
.auth-forgot{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;padding:0;text-align:right;display:block;width:100%;margin-top:-8px;font-family:inherit;transition:color 0.15s}
.auth-forgot:hover{color:var(--accent2)}

/* ===== INPUT WRAPS & ICONS (auth forms) ===== */
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .form-input{padding-left:38px}
.input-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;display:flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0}
.input-icon svg{width:16px;height:16px;display:block}
.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;padding:2px;display:flex;align-items:center}
.password-toggle svg{width:16px;height:16px}
.password-toggle:hover{color:var(--text1)}

/* ===== ICON BUTTONS ===== */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--text3);cursor:pointer;transition:all 0.15s;flex-shrink:0}
.icon-btn svg{width:14px;height:14px;display:block}
.icon-btn:hover{background:var(--bg4);color:var(--text1);border-color:var(--border)}
.icon-btn.danger:hover{background:rgba(224,82,82,0.1);color:var(--red);border-color:rgba(224,82,82,0.2)}

/* ===== MODAL CLOSE ===== */
.modal-close{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all 0.15s}
.modal-close svg{width:14px;height:14px;display:block}
.modal-close:hover{background:var(--bg4);color:var(--text1)}

/* ===== SPINNER ===== */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,0.2);border-top-color:#0c0c0d;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
.spinner-dark{border-color:rgba(255,255,255,0.15);border-top-color:var(--text1)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== SETUP NOTICE — inside auth wrap, not overlapping ===== */
.setup-notice{background:rgba(212,168,67,0.07);border:1px solid rgba(212,168,67,0.18);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;width:100%}
.setup-notice-inner{display:flex;align-items:flex-start;gap:10px}
.setup-icon{color:var(--gold);flex-shrink:0;margin-top:1px;display:flex;align-items:center}
.setup-icon svg{width:15px;height:15px;display:block}
.setup-title{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:3px}
.setup-desc{font-size:11px;color:var(--text2);line-height:1.5}
.setup-steps{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.setup-step{font-size:11px;color:var(--text2)}
.setup-link{color:var(--accent2)}
.setup-close{margin-left:auto;color:var(--text3);cursor:pointer;padding:2px;flex-shrink:0;display:flex;align-items:center;background:none;border:none;line-height:1}
.setup-close svg{width:14px;height:14px;display:block}
.setup-close:hover{color:var(--text1)}

/* ===== CREATOR ===== */
.creator-hero{display:flex;gap:24px;align-items:center;padding:24px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px}
.creator-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#0c0c0d;flex-shrink:0}
.creator-name{font-size:22px;font-weight:700;color:var(--text1);letter-spacing:-0.5px;margin-bottom:4px}
.creator-handle{font-size:13px;color:var(--text2);margin-bottom:10px}
.creator-roles{display:flex;gap:6px;flex-wrap:wrap}
.creator-role-tag{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--text2)}
.creator-section-title{font-size:14px;font-weight:600;color:var(--text1);margin-bottom:10px}
.creator-text{font-size:13px;color:var(--text2);line-height:1.7}
.creator-interests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.creator-interest{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text2)}
.creator-footer-text{font-size:11px;color:var(--text3);text-align:center;margin-top:20px}

/* ===== RESPONSIVE ===== */
@media (max-width:1200px){
  .home-stat-grid{grid-template-columns:repeat(2,1fr)}
  .home-hero{grid-template-columns:1fr 340px}
}
@media (max-width:1100px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}

  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(d); due.setHours(0,0,0,0);
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return `${Math.abs(diff)}d overdue`;
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff < 7) return `${diff}d`;

async function loadUserData(uid) {
  if (!db) return null;
  try {
    const doc = await db.collection('users').doc(uid).get();
    if (doc.exists) return doc.data();
    return null;
  } catch(e) { console.error('loadUserData:', e); return null; }
}

async function saveUserData(uid, data) {
  if (!db || !uid) return;
  try {
    await db.collection('users').doc(uid).set(data, { merge: true });
  } catch(e) { console.error('saveUserData:', e); }
}

// ── localStorage fallback ──────────────────────────────────
// Data is ALWAYS written to localStorage as a safety net.
// If Firebase is configured, it also syncs to Firestore.
// On load, Firestore takes priority; localStorage is the backup.
function localSave(uid, data) {
  try {
    localStorage.setItem('flipclock_user_' + uid, JSON.stringify(data));
    localStorage.setItem('flipclock_uid', uid);
  } catch(e) { /* storage full — ignore */ }
}

function localLoad(uid) {
  try {
    const raw = localStorage.getItem('flipclock_user_' + uid);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function localLoadLastUid() {
  try { return localStorage.getItem('flipclock_uid'); } catch(e) { return null; }
}

// Debounced save — writes localStorage immediately, Firestore after 1.5 s
let saveTimer = null;
function debouncedSave(uid, data) {
  if (!uid || !data) return;
  // Always persist to localStorage right away (no data loss on refresh)
  localSave(uid, data);
  // Also sync to Firestore if available
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveUserData(uid, data), 1500);
}

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const addToast = useCallback((title, sub, type, dur=3000) => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, title, sub, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id!==id)), dur);
  }, []);
  return { toasts, addToast };
}
