<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FlipClock Study OS</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0f;--bg2:#141416;--bg3:#1a1a1d;--bg4:#222226;
  --border:#2a2a2e;--border2:#333338;
  --text1:#f0f0f2;--text2:#a0a0a8;--text3:#606068;
  --accent:#e8e0cc;--accent2:#c8b89a;
  --gold:#d4a843;--gold-dim:#3a2e10;
  --red:#e05252;--green:#52c878;--blue:#5294e0;--purple:#9b52e0;--orange:#e07820;
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --sidebar-w:220px;--transition:0.15s ease;
  --shadow:0 2px 12px rgba(0,0,0,0.4);--shadow-lg:0 8px 40px rgba(0,0,0,0.6);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#root{display:flex;height:100vh;overflow:hidden}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:3px}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:100}
.sidebar-brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.brand-icon{width:32px;height:32px;background:var(--accent);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-0.3px;color:var(--text1)}
.brand-sub{font-size:10px;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase}
.sidebar-user{padding:12px 18px;border-bottom:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent2);flex-shrink:0}
.user-name{font-size:13px;font-weight:500;color:var(--text1)}
.user-level{font-size:11px;color:var(--text3)}
.xp-bar{margin-top:8px}
.xp-bar-track{height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.xp-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 0.5s ease}
.xp-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:4px}
.sidebar-nav{padding:10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:var(--radius-sm);font-size:13px;color:var(--text2);cursor:pointer;transition:background var(--transition),color var(--transition);position:relative;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text1)}
.nav-item.active{background:var(--bg4);color:var(--text1)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:14px;background:var(--accent2);border-radius:1px}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7;display:flex;align-items:center;justify-content:center}
.nav-item.active .nav-icon,.nav-item:hover .nav-icon{opacity:1}
.nav-badge{margin-left:auto;background:var(--red);color:white;font-size:10px;font-weight:600;padding:1px 5px;border-radius:10px;min-width:18px;text-align:center}
.nav-streak{margin-left:auto;font-size:11px;color:var(--gold);font-weight:500}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--border)}
.streak-display{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gold);font-weight:500}

/* ===== MAIN CONTENT ===== */
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;min-height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:500;color:var(--text1);flex:1}
.topbar-clock{font-family:var(--mono);font-size:13px;color:var(--text2);letter-spacing:1px}
.topbar-btn{width:32px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background var(--transition),color var(--transition);cursor:pointer}
.topbar-btn:hover{background:var(--bg4);color:var(--text1)}
.topbar-btn svg{width:15px;height:15px}
.topbar-btn-mobile{display:none}
.page-content{padding:24px;flex:1}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;border:1px solid transparent;transition:all var(--transition);white-space:nowrap;cursor:pointer}
.btn-primary{background:var(--accent);color:#0e0e0f;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text1);border-color:var(--border2)}
.btn-secondary:hover{background:var(--bg4)}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg3);color:var(--text1)}
.btn-danger{background:rgba(224,82,82,0.1);color:var(--red);border-color:rgba(224,82,82,0.3)}
.btn-danger:hover{background:rgba(224,82,82,0.2)}
.btn-icon{padding:8px}
.btn-lg{padding:12px 28px;font-size:14px;border-radius:var(--radius)}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-auth{width:100%;justify-content:center;padding:11px;font-size:14px;border-radius:var(--radius)}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;background:white;color:#1a1a1a;border:1px solid #e0e0e0;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all var(--transition)}
.btn-google:hover{background:#f5f5f5;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.btn-google:disabled{opacity:0.6;cursor:not-allowed}
.btn-google svg{width:20px;height:20px;flex-shrink:0}

/* ===== CARDS ===== */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:12px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px}

/* ===== STAT CARDS ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:600;color:var(--text1);letter-spacing:-0.5px;line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}
.stat-card.gold .stat-value{color:var(--gold)}
.stat-card.green .stat-value{color:var(--green)}

/* ===== FLIP CLOCK (2D fallback) ===== */
.flip-clock-body{background:linear-gradient(145deg,#f5f0e8,#e8e0d0);border-radius:22px;padding:30px 40px 26px;box-shadow:0 24px 70px rgba(0,0,0,0.75),inset 0 1px 0 rgba(255,255,255,0.6),0 0 0 2px #ccc0a0;position:relative}
.flip-clock-body::before{content:'';position:absolute;inset:8px;border-radius:15px;border:2px solid #1a1a1a;pointer-events:none;z-index:0}
.flip-clock-digits{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.flip-sep{display:flex;flex-direction:column;gap:16px;margin:0 4px;padding-bottom:10px}
.flip-sep-dot{width:8px;height:8px;border-radius:50%;background:#1a1a1a}
.flip-digit-pair{display:flex;gap:5px}
.flip-digit{width:72px;height:104px;position:relative;border-radius:9px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.6)}
.flip-upper{position:absolute;top:0;left:0;right:0;height:50%;background:#1e1e22;border-radius:9px 9px 0 0;border-bottom:1.5px solid #0a0a0a;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;overflow:hidden;transform-origin:bottom center}
.flip-lower{position:absolute;bottom:0;left:0;right:0;height:50%;background:#252529;border-radius:0 0 9px 9px;border-top:1px solid #3a3a3e;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;overflow:hidden}
.flip-digit-num{font-family:var(--mono);font-size:68px;font-weight:700;color:#e8e4dc;line-height:1;position:absolute;letter-spacing:-3px;text-shadow:0 2px 10px rgba(0,0,0,0.6)}
.flip-upper .flip-digit-num{bottom:-0.01em}
.flip-lower .flip-digit-num{top:-0.01em}
.flip-hinge{position:absolute;top:50%;left:-2px;right:-2px;height:2px;background:#080808;z-index:20;transform:translateY(-50%)}
.flip-hinge::before,.flip-hinge::after{content:'';position:absolute;width:10px;height:10px;background:#2a2a2a;border-radius:50%;top:-4px;box-shadow:0 1px 4px rgba(0,0,0,0.9)}
.flip-hinge::before{left:4px}
.flip-hinge::after{right:4px}
.flip-upper::after{content:'';position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,0.3));pointer-events:none}
.flip-lower::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(rgba(0,0,0,0.25),transparent);pointer-events:none;z-index:1}
@keyframes flipUpperLeave{0%{transform:rotateX(0deg)}100%{transform:rotateX(-90deg)}}
@keyframes flipLowerEnter{0%{transform:rotateX(90deg)}100%{transform:rotateX(0deg)}}
.flip-upper.flipping{animation:flipUpperLeave 0.22s ease-in forwards}
.flip-lower-ghost{position:absolute;bottom:0;left:0;right:0;height:50%;background:#252529;border-radius:0 0 9px 9px;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;overflow:hidden;animation:flipLowerEnter 0.22s ease-out 0.22s forwards;transform:rotateX(90deg);transform-origin:top center;z-index:15}
.flip-lower-ghost .flip-digit-num{top:-0.01em}
.clock-mode-label{font-family:var(--mono);font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:#6a6050;text-align:center;margin-top:12px;position:relative;z-index:1}

/* ===== FOCUS PAGE ===== */
.focus-layout{display:grid;grid-template-columns:1fr 288px;gap:28px;align-items:start}
.focus-left{display:flex;flex-direction:column;align-items:center;gap:0}
.mode-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:40px;padding:4px;gap:2px;margin-bottom:28px}
.mode-tab{padding:7px 18px;border-radius:30px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:all 0.18s;letter-spacing:0.2px;white-space:nowrap}
.mode-tab.active{background:var(--bg);color:var(--text1);box-shadow:0 1px 6px rgba(0,0,0,0.5),0 0 0 1px var(--border)}
.mode-tab:hover:not(.active){color:var(--text2)}
.focus-progress-ring{width:100%;max-width:480px;height:2px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-bottom:22px}
.focus-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--gold));border-radius:2px;transition:width 0.5s linear}
.focus-task-card{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.focus-task-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex-shrink:0;box-shadow:0 0 8px rgba(212,168,67,0.6)}
.focus-task-dot.idle{background:var(--border2);box-shadow:none}
.focus-task-text{flex:1;min-width:0}
.focus-task-label{font-size:10px;color:var(--text3);letter-spacing:0.7px;text-transform:uppercase;margin-bottom:3px}
.focus-task-name{font-size:13px;font-weight:500;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus-task-meta{font-size:11px;color:var(--text3);margin-top:2px}
.focus-controls{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.btn-focus-main{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 40px;height:52px;border-radius:26px;font-size:14px;font-weight:600;letter-spacing:0.2px;cursor:pointer;transition:all 0.18s;border:1.5px solid transparent;font-family:var(--font)}
.btn-focus-main.start{background:var(--accent);color:#0e0e0f;border-color:var(--accent)}
.btn-focus-main.start:hover{background:var(--accent2);border-color:var(--accent2);box-shadow:0 4px 20px rgba(232,224,204,0.2);transform:translateY(-1px)}
.btn-focus-main.pause{background:transparent;color:var(--gold);border-color:rgba(212,168,67,0.35)}
.btn-focus-main.pause:hover{background:rgba(212,168,67,0.08)}
.btn-focus-main.resume{background:var(--accent);color:#0e0e0f;border-color:var(--accent)}
.btn-focus-main.resume:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-focus-main svg{width:15px;height:15px}
.btn-focus-icon{width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;transition:all 0.18s;flex-shrink:0}
.btn-focus-icon:hover:not(:disabled){background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.btn-focus-icon:disabled{opacity:0.25;cursor:not-allowed}
.btn-focus-icon svg{width:14px;height:14px}
.focus-stats-bar{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.focus-stat-divider{background:var(--border)}
.focus-stat-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:14px 8px}
.focus-stat-val{font-size:17px;font-weight:600;color:var(--text1);line-height:1}
.focus-stat-label{font-size:10px;color:var(--text3);letter-spacing:0.4px;text-transform:uppercase}
.pom-dots{display:flex;gap:5px;justify-content:center;margin-bottom:1px}
.pom-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:background 0.3s}
.pom-dot.done{background:var(--accent2)}
.pom-dot.active{background:var(--gold);box-shadow:0 0 6px rgba(212,168,67,0.7)}
.focus-right{display:flex;flex-direction:column;gap:12px;position:sticky;top:24px}
.focus-summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.focus-summary-row:last-child{border-bottom:none}

/* ===== COMPLETION OVERLAY ===== */
.completion-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.completion-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:440px;overflow:hidden;animation:slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.completion-header{padding:28px 28px 20px;text-align:center;border-bottom:1px solid var(--border)}
.completion-icon{font-size:40px;margin-bottom:12px}
.completion-title{font-size:22px;font-weight:700;color:var(--text1);letter-spacing:-0.5px;margin-bottom:6px}
.completion-sub{font-size:13px;color:var(--text2)}
.completion-rewards{padding:20px 28px;display:flex;flex-direction:column;gap:10px}
.reward-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg3);border-radius:var(--radius-sm);font-size:13px}
.reward-label{color:var(--text2)}
.reward-value{font-weight:600;color:var(--text1)}
.reward-value.gold{color:var(--gold)}
.reward-value.green{color:var(--green)}
.completion-footer{padding:16px 28px 24px;display:flex;gap:8px}
.levelup-banner{background:linear-gradient(135deg,var(--gold-dim),rgba(212,168,67,0.15));border:1px solid rgba(212,168,67,0.3);border-radius:var(--radius-sm);padding:12px 16px;margin:0 28px;display:flex;align-items:center;gap:12px}
.levelup-icon{font-size:24px;flex-shrink:0}
.levelup-text{font-size:13px;color:var(--gold);font-weight:500}
.levelup-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ===== HOME ===== */
.home-hero{display:grid;grid-template-columns:1fr 420px;gap:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px;min-height:300px}
.home-hero-text{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:0}
.home-hero-greeting{font-size:11px;color:var(--text3);letter-spacing:0.6px;text-transform:uppercase;margin-bottom:10px}
.home-hero-name{font-size:26px;font-weight:600;letter-spacing:-0.5px;color:var(--text1);line-height:1.2;margin-bottom:8px}
.home-hero-sub{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.home-hero-clock{background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:300px;position:relative}
.home-hero-clock::before{content:'';position:absolute;width:420px;height:260px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(212,168,67,0.10) 0%,transparent 70%);filter:blur(32px);pointer-events:none;z-index:0}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.next-action-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:20px}
.na-icon{width:44px;height:44px;background:var(--gold-dim);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.na-icon svg{width:20px;height:20px;color:var(--gold)}
.na-content{flex:1;min-width:0}
.na-label{font-size:10px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:3px}
.na-title{font-size:15px;font-weight:500;color:var(--text1)}
.na-meta{font-size:12px;color:var(--text2);margin-top:3px}

/* ===== TASKS ===== */
.task-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.task-filters{display:flex;gap:4px;flex-wrap:wrap}
.filter-btn{padding:5px 10px;border-radius:5px;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all var(--transition)}
.filter-btn.active{background:var(--bg4);color:var(--text1);border-color:var(--border2)}
.filter-btn:hover{color:var(--text1)}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:flex-start;gap:12px;transition:border-color var(--transition),background var(--transition)}
.task-item:hover{border-color:var(--border2);background:var(--bg3)}
.task-item.done{opacity:0.5}

let _auth=null,_db=null,_gProvider=null,_fbReady=false;
function initFirebase(){
  if(_fbReady)return true;
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(!cfg||cfg.apiKey.startsWith('YOUR_'))return false;
    firebase.initializeApp(cfg);
    _auth=firebase.auth();
    _db=firebase.firestore();
    _gProvider=new firebase.auth.GoogleAuthProvider();
    _gProvider.addScope('email');_gProvider.addScope('profile');

  }catch(e){console.warn('Firebase init:',e.message);return false;}
}

// ============================================================
// DATE UTILS — all local-timezone-safe
// ============================================================
function localDateStr(d=new Date()){
  // YYYY-MM-DD in LOCAL timezone (avoids UTC shift bugs)
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function localDayOfWeek(d=new Date()){return d.getDay()===0?6:d.getDay()-1;} // Mon=0
function formatMinutes(m){
  if(!m||m<1)return'0m';
  if(m<60)return`${Math.round(m)}m`;
  const h=Math.floor(m/60),min=Math.round(m%60);
  return min>0?`${h}h ${min}m`:`${h}h`;
}
function formatDue(d){
  if(!d)return'';
  const today=new Date();today.setHours(0,0,0,0);
  const due=new Date(d);due.setHours(0,0,0,0);
  const diff=Math.round((due-today)/86400000);
  if(diff<0)return`${Math.abs(diff)}d overdue`;
  if(diff===0)return'Today';if(diff===1)return'Tomorrow';
  if(diff<7)return`${diff}d`;
  return due.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function isDueOverdue(d){if(!d)return false;const t=new Date();t.setHours(0,0,0,0);return new Date(d)<t;}
function timeAgo(iso){
  if(!iso)return'';
  const diff=Date.now()-new Date(iso).getTime();
  if(diff<60000)return'just now';if(diff<3600000)return`${Math.floor(diff/60000)}m ago`;
  if(diff<86400000)return`${Math.floor(diff/3600000)}h ago`;return`${Math.floor(diff/86400000)}d ago`;
}

// ============================================================
// XP ENGINE — centralized, no duplication
// ============================================================
const XP_THRESHOLDS=[0,200,500,900,1400,2000,2700,3500,4400,5400,6500];
const LEVEL_TITLES=['Novice','Learner','Student','Scholar','Achiever','Expert','Master','Champion','Legend','Genius'];
function getLevel(xp){let l=1;for(let i=1;i<XP_THRESHOLDS.length;i++){if(xp>=XP_THRESHOLDS[i])l=i+1;else break;}return Math.min(l,10);}
function xpForLevel(l){return XP_THRESHOLDS[Math.max(0,l-1)]||0;}
function xpForNextLevel(l){return XP_THRESHOLDS[l]||XP_THRESHOLDS[XP_THRESHOLDS.length-1];}
function getLevelTitle(l){return LEVEL_TITLES[Math.min(l-1,LEVEL_TITLES.length-1)];}
const XP_REWARDS={focus_15:15,focus_25:25,focus_50:50,focus_90:80,task_complete:20,goal_milestone:50,goal_complete:150,habit_day:10,achievement:100};
function calcSessionXP(mins){
  if(mins>=90)return XP_REWARDS.focus_90;if(mins>=50)return XP_REWARDS.focus_50;
  if(mins>=25)return XP_REWARDS.focus_25;return XP_REWARDS.focus_15;
}

// ============================================================
// STREAK ENGINE — timezone-safe
// ============================================================
function calcStreak(lastStudyDate,currentStreak){
  const today=localDateStr();
  if(!lastStudyDate)return{streak:1,lastStudyDate:today};
  if(lastStudyDate===today)return{streak:currentStreak,lastStudyDate:today};
  // Check if yesterday
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=localDateStr(yesterday);
  if(lastStudyDate===yStr)return{streak:currentStreak+1,lastStudyDate:today};
  // Streak broken
  return{streak:1,lastStudyDate:today};
}

// Check all achievements, return newly unlocked ones with XP
function checkAchievements(state){
  const newly=[];
  const updated={...state.achievements};
  let bonusXP=0;
  ACHIEVEMENTS.forEach(a=>{
    if(!updated[a.key]&&a.check(state)){
      updated[a.key]=true;
      bonusXP+=a.xp;
      newly.push(a);
    }
  });
  return{updated,bonusXP,newly};
}

const SCHEMA_VERSION=4;
function defaultUserData(name='Student'){
  return{
    _v:SCHEMA_VERSION,profile:{name,dailyGoalMin:120},
    xp:0,level:1,streak:0,lastStudyDate:null,
    studyMinToday:0,lastTodayDate:null,sessionsToday:0,
    totalStudyMin:0,totalSessions:0,totalTasksDone:0,
    tasks:[],goals:[],habits:[],activity:[],
    achievements:{},
    weeklyData:[0,0,0,0,0,0,0],subjectData:{},heatmapData:{},
    settings:{sound:true,notifications:false,autoBreak:false,xpPopups:true,flipSound:true,flipVolume:0.22,completionSound:'bells',completionVolume:0.55},
    nextTaskId:1,nextGoalId:1,nextHabitId:1,
    currentTimerTask:null,
  };
}

function migrateData(raw){
  if(!raw||typeof raw!=='object')return null;
  const d={...raw};
  // v1→v2: add achievements object
  if(!d.achievements)d.achievements={};
  // v2→v3: fix weeklyData length
  if(!Array.isArray(d.weeklyData)||d.weeklyData.length!==7)d.weeklyData=[0,0,0,0,0,0,0];
  // v3→v4: add schema version, migrate old achievement keys
  if(d.achievements){
    // Rename legacy keys
    if(d.achievements.firstFocus===undefined&&d.achievements.firstFocus!==false){}
    // ensure no undefined values
    ACHIEVEMENTS.forEach(a=>{if(d.achievements[a.key]===undefined)d.achievements[a.key]=false;});
  }
  if(!d.settings)d.settings={};
  if(d.settings.flipSound===undefined)d.settings.flipSound=true;
  if(d.settings.flipVolume===undefined)d.settings.flipVolume=0.22;
  if(!d.profile)d.profile={name:'Student',dailyGoalMin:120};
  if(!d.profile.dailyGoalMin)d.profile.dailyGoalMin=120;
  if(!Array.isArray(d.tasks))d.tasks=[];
  if(!Array.isArray(d.goals))d.goals=[];
  if(!Array.isArray(d.habits))d.habits=[];
  if(!Array.isArray(d.activity))d.activity=[];
  if(typeof d.xp!=='number'||d.xp<0)d.xp=0;
  if(typeof d.streak!=='number'||d.streak<0)d.streak=0;
  if(typeof d.totalStudyMin!=='number')d.totalStudyMin=0;
  if(typeof d.totalSessions!=='number')d.totalSessions=0;
  if(typeof d.totalTasksDone!=='number')d.totalTasksDone=0;
  d._v=SCHEMA_VERSION;
  return d;
}

const LS_KEY=uid=>`flipclock_v4_${uid}`;
function localSave(uid,data){
  try{localStorage.setItem(LS_KEY(uid),JSON.stringify({...data,_ts:Date.now()}));}catch(e){}
}
function localLoad(uid){
  try{const r=localStorage.getItem(LS_KEY(uid));return r?migrateData(JSON.parse(r)):null;}catch(e){return null;}
}
async function cloudLoad(uid){
  if(!_db||!uid)return null;
  try{const doc=await _db.collection('users').doc(uid).get();return doc.exists?migrateData(doc.data()):null;}catch(e){console.warn('cloudLoad:',e.message);return null;}
}
async function cloudSave(uid,data){
  if(!_db||!uid)return;
  try{await _db.collection('users').doc(uid).set({...data,_ts:Date.now()},{merge:true});}
  catch(e){console.warn('cloudSave:',e.message);}
}

// Debounced save: immediate localStorage, debounced Firestore
let _saveTimer=null;
function persistData(uid,data){
  if(!uid||!data)return;
  const stamped={...data,_ts:Date.now()};
  localSave(uid,stamped);
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>cloudSave(uid,stamped),2000);
}

let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx||_audioCtx.state==='closed'){
    _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }
  if(_audioCtx.state==='suspended')_audioCtx.resume();
  return _audioCtx;
}
function playFlipTick(volume=0.22){
  try{
    const ctx=getAudioCtx();const now=ctx.currentTime;
    const bufSize=Math.floor(ctx.sampleRate*0.016);
    const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2.8);
    const noise=ctx.createBufferSource();noise.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=1.1;
    const g=ctx.createGain();g.gain.setValueAtTime(Math.min(1,volume*0.85),now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.016);
    noise.connect(bp);bp.connect(g);g.connect(ctx.destination);
    noise.start(now);noise.stop(now+0.018);
    // Low thud
    const osc=ctx.createOscillator();osc.type='triangle';
    osc.frequency.setValueAtTime(170,now);osc.frequency.exponentialRampToValueAtTime(75,now+0.014);
    const og=ctx.createGain();og.gain.setValueAtTime(volume*0.4,now);og.gain.exponentialRampToValueAtTime(0.0001,now+0.014);
    osc.connect(og);og.connect(ctx.destination);osc.start(now);osc.stop(now+0.015);
  }catch(e){}
}
function playCompletionSound(type='bells',volume=0.55){
  try{
    const ctx=getAudioCtx();const now=ctx.currentTime;
    const master=ctx.createGain();master.gain.setValueAtTime(0,now);
    master.gain.linearRampToValueAtTime(volume*0.45,now+0.25);master.connect(ctx.destination);
    const SEQS={bells:[523,659,784,1047,1319],chime:[392,494,587,784,988],birds:[880,1046,1318,1568,1318,1046,880]};
    const freqs=SEQS[type]||SEQS.bells;
    freqs.forEach((freq,i)=>{
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.type=type==='birds'?'triangle':'sine';
      o.frequency.setValueAtTime(freq,now+i*0.2);
      g.gain.setValueAtTime(0,now+i*0.2);g.gain.linearRampToValueAtTime(0.25,now+i*0.2+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,now+i*0.2+2.2);
      o.connect(g);g.connect(master);o.start(now+i*0.2);o.stop(now+i*0.2+2.3);
    });
  }catch(e){}
}

const AuthCtx=createContext(null);
function useAuth(){return useContext(AuthCtx);}

function AuthProvider({children}){
  const [user,setUser]=useState(undefined);
  const fbRef=useRef(false);
  useEffect(()=>{
    fbRef.current=initFirebase();
    if(!fbRef.current){setUser(null);return;}
    const unsub=_auth.onAuthStateChanged(u=>setUser(u||null));
    return unsub;
  },[]);
  function friendlyError(code){
    const m={'auth/user-not-found':'No account with this email.','auth/wrong-password':'Incorrect password.','auth/email-already-in-use':'Account already exists.','auth/weak-password':'Password must be 6+ characters.','auth/invalid-email':'Invalid email address.','auth/too-many-requests':'Too many attempts. Try later.','auth/network-request-failed':'Network error.','auth/popup-closed-by-user':'Sign-in cancelled.','auth/requires-recent-login':'Please log in again.'};
    return m[code]||'Something went wrong. Try again.';
  }
  async function signIn(email,password){
    if(!fbRef.current)return{success:false,error:'Firebase not configured.'};
    try{await _auth.signInWithEmailAndPassword(email,password);return{success:true};}
    catch(e){return{success:false,error:friendlyError(e.code)};}
  }
  async function signUp(email,password,name){
    if(!fbRef.current)return{success:false,error:'Firebase not configured.'};
    try{
      const cred=await _auth.createUserWithEmailAndPassword(email,password);
      await cred.user.updateProfile({displayName:name});
      const fresh=defaultUserData(name);
      fresh.profile={name,dailyGoalMin:120};fresh.createdAt=new Date().toISOString();
      await cloudSave(cred.user.uid,fresh);localSave(cred.user.uid,fresh);
      return{success:true};
    }catch(e){return{success:false,error:friendlyError(e.code)};}
  }
  async function signInGoogle(){
    if(!fbRef.current)return{success:false,error:'Firebase not configured.'};
    try{
      const r=await _auth.signInWithPopup(_gProvider);
      if(r.additionalUserInfo&&r.additionalUserInfo.isNewUser){
        const n=r.user.displayName||'Student';
        const fresh=defaultUserData(n);fresh.createdAt=new Date().toISOString();
        await cloudSave(r.user.uid,fresh);localSave(r.user.uid,fresh);
      }
      return{success:true};
    }catch(e){return{success:false,error:friendlyError(e.code)};}
  }
  async function signOut(){
    if(!fbRef.current)return{success:true};
    try{await _auth.signOut();return{success:true};}catch(e){return{success:false,error:e.message};}
  }
  async function sendPasswordReset(email){
    if(!fbRef.current)return{success:false,error:'Firebase not configured.'};
    try{await _auth.sendPasswordResetEmail(email);return{success:true};}catch(e){return{success:false,error:friendlyError(e.code)};}
  }
  async function changePassword(cur,next){
    if(!_auth||!_auth.currentUser)return{success:false,error:'Not authenticated.'};
    try{
      const cred=firebase.auth.EmailAuthProvider.credential(_auth.currentUser.email,cur);
      await _auth.currentUser.reauthenticateWithCredential(cred);
      await _auth.currentUser.updatePassword(next);return{success:true};
    }catch(e){return{success:false,error:friendlyError(e.code)};}
  }
  async function deleteAccount(){
    if(!_auth||!_auth.currentUser)return{success:false,error:'Not authenticated.'};
    try{
      if(_db)await _db.collection('users').doc(_auth.currentUser.uid).delete();
      await _auth.currentUser.delete();return{success:true};
    }catch(e){return{success:false,error:e.message};}
  }
  return React.createElement(AuthCtx.Provider,{value:{user,signIn,signUp,signInGoogle,signOut,sendPasswordReset,changePassword,deleteAccount}},children);
}

function useToasts(){
  const [toasts,setToasts]=useState([]);
  const addToast=useCallback((title,sub,type,dur=3200)=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,title,sub,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),dur);
  },[]);
  return{toasts,addToast};
}

function AppShell({user,userData,setUserData,onLogout,addToast}){
  const[page,setPage]=useState('home');const[showCmd,setShowCmd]=useState(false);const[showNewTask,setShowNewTask]=useState(false);const[mobileOpen,setMobileOpen]=useState(false);
  const{changePassword,deleteAccount}=useAuth();
  // Reset daily stats when day changes
  useEffect(()=>{
    const today=localDateStr();
    if(userData.lastTodayDate!==today){
      mutate(s=>{
        const wd=[...(s.weeklyData||[0,0,0,0,0,0,0])];wd[localDayOfWeek()]=0;
        return{...s,studyMinToday:0,sessionsToday:0,lastTodayDate:today,weeklyData:wd};
      });
    }
  },[]);
  // Keyboard shortcuts
  useEffect(()=>{
    const h=e=>{
      if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setShowCmd(true);return;}
      if(e.key==='Escape'){setShowCmd(false);setShowNewTask(false);setMobileOpen(false);return;}
      if(e.key==='n'){e.preventDefault();setShowNewTask(true);return;}
      if(e.key==='1')setPage('home');if(e.key==='2')setPage('focus');if(e.key==='3')setPage('tasks');
      if(e.key==='4')setPage('goals');if(e.key==='5')setPage('habits');
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[]);

  // Central state mutator — all updates go through here for persistence
  function mutate(fn){
    setUserData(prev=>{
      const next=typeof fn==='function'?fn(prev):{...prev,...fn};
      if(user&&user.uid)persistData(user.uid,next);
      return next;
    });
  }

  // Central XP award — prevents double-awarding
  function awardXP(amount,source){
    mutate(s=>({...s,xp:Math.max(0,s.xp+amount)}));
  }

  function addActivity(text,type,xp=0){
    mutate(s=>({...s,activity:[{text,type,xp,ts:new Date().toISOString()},...(s.activity||[])].slice(0,100)}));
  }

  // Session complete — returns result for CompletionOverlay
  const handleSessionComplete=useCallback((mins,task)=>{
    const xpGained=calcSessionXP(mins);
    const today=localDateStr();const dayIdx=localDayOfWeek();
    let result=null;
    mutate(s=>{
      const wd=[...(s.weeklyData||[0,0,0,0,0,0,0])];wd[dayIdx]=(wd[dayIdx]||0)+mins;
      const hm={...s.heatmapData};hm[today]=(hm[today]||0)+mins;
      const sd={...s.subjectData};if(task&&task.subject)sd[task.subject]=(sd[task.subject]||0)+mins;
      const{streak:newStreak,lastStudyDate}=calcStreak(s.lastStudyDate,s.streak);
      const newTotalSessions=s.totalSessions+1;const newTotalMin=s.totalStudyMin+mins;
      const newXP=s.xp+xpGained;
      const prevLevel=getLevel(s.xp);const newLevel=getLevel(newXP);
      const intermediate={...s,xp:newXP,totalStudyMin:newTotalMin,studyMinToday:(s.studyMinToday||0)+mins,totalSessions:newTotalSessions,sessionsToday:(s.sessionsToday||0)+1,lastStudyDate,streak:newStreak,weeklyData:wd,heatmapData:hm,subjectData:sd};
      const{updated:newAchs,bonusXP,newly}=checkAchievements(intermediate);
      const finalXP=newXP+bonusXP;
      // Collect result for overlay
      result={mins,xpGained:xpGained+bonusXP,newLevel:getLevel(finalXP),prevLevel,newlyUnlocked:newly,newStreak};
      return{...intermediate,achievements:newAchs,xp:finalXP};
    });
    // Activity entry
    setTimeout(()=>addActivity(`${mins}m focus${task?` · ${task.subject}`:''}`, 'focus', xpGained),[0]);
    if(settings().xpPopups!==false)setTimeout(()=>addToast(`+${xpGained} XP`,`${mins} minutes focused`,'gold'),100);
    return result;
  },[]);

  function settings(){return userData.settings||{};}

  function handleToggleTask(id){
    mutate(s=>{
      const tasks=s.tasks.map(t=>t.id===id?{...t,done:!t.done,completedAt:!t.done?new Date().toISOString():null}:t);
      const task=tasks.find(t=>t.id===id);
      const xpDelta=task.done?20:-20;
      const totalDelta=task.done?1:-1;
      if(task.done){setTimeout(()=>{addActivity(`Completed: ${task.title}`,'task',20);addToast('Task done! +20 XP',task.title,'green');},0);}
      return{...s,tasks,xp:Math.max(0,s.xp+xpDelta),totalTasksDone:Math.max(0,s.totalTasksDone+totalDelta)};
    });
  }
  function handleAddTask(form){mutate(s=>({...s,tasks:[{...form,id:s.nextTaskId,done:false,createdAt:new Date().toISOString()},...s.tasks],nextTaskId:s.nextTaskId+1}));addToast('Task added',form.title);}
  function handleEditTask(task){mutate(s=>({...s,tasks:s.tasks.map(t=>t.id===task.id?task:t)}));addToast('Task updated');}
  function handleDeleteTask(id){if(!window.confirm('Delete this task?'))return;mutate(s=>({...s,tasks:s.tasks.filter(t=>t.id!==id)}));}
  function handleStartFocusTask(task){mutate(s=>({...s,currentTimerTask:task}));setPage('focus');addToast('Task selected',task.title);}
  function handleAddGoal(form){mutate(s=>({...s,goals:[...s.goals,{...form,id:s.nextGoalId,createdAt:new Date().toISOString()}],nextGoalId:s.nextGoalId+1}));addToast('Goal created',form.name);}
  function handleEditGoal(goal){mutate(s=>({...s,goals:s.goals.map(g=>g.id===goal.id?goal:g)}));addToast('Goal updated');}
  function handleDeleteGoal(id){if(!window.confirm('Delete this goal?'))return;mutate(s=>({...s,goals:s.goals.filter(g=>g.id!==id)}));}
  function handleUpdateProgress(id,val){
    mutate(s=>({...s,goals:s.goals.map(g=>{
      if(g.id!==id)return g;
      const newVal=Math.max(0,Math.min(val,g.target*10));// allow overshoot for flexibility
      const justCompleted=newVal>=g.target&&g.current<g.target;
      if(justCompleted){setTimeout(()=>{addActivity(`Goal complete: ${g.name}`,'goal',150);addToast('Goal reached! +150 XP',g.name,'gold');},0);}
      return{...g,current:newVal};
    }),xp:s.xp+5}));
  }
  function handleToggleMilestone(goalId,msIdx){
    mutate(s=>({...s,goals:s.goals.map(g=>{
      if(g.id!==goalId)return g;
      const msDone=[...g.msDone];msDone[msIdx]=!msDone[msIdx];
      if(msDone[msIdx]){setTimeout(()=>{addActivity(`Milestone: ${g.milestones[msIdx]}`,'goal',50);addToast('Milestone done! +50 XP','','gold');},0);}
      return{...g,msDone};
    }),xp:s.goals.find(g=>g.id===goalId)?.msDone[msIdx]?s.xp:s.xp+50}));
  }
  function handleAddHabit(form){mutate(s=>({...s,habits:[...s.habits,{...form,id:s.nextHabitId,days:[false,false,false,false,false,false,false],streak:0,createdAt:new Date().toISOString()}],nextHabitId:s.nextHabitId+1}));addToast('Habit added');}
  function handleDeleteHabit(id){if(!window.confirm('Delete this habit?'))return;mutate(s=>({...s,habits:s.habits.filter(h=>h.id!==id)}));}
  function handleToggleDay(id,di){
    mutate(s=>({...s,habits:s.habits.map(h=>{
      if(h.id!==id)return h;
      const days=[...h.days];days[di]=!days[di];
      const streak=days.filter(Boolean).length;// simplified streak
      if(days[di])setTimeout(()=>addToast('Habit tracked! +10 XP','','green'),0);
      return{...h,days,streak};
    }),xp:s.habits.find(h=>h.id===id)?.days[di]?s.xp:s.xp+10}));
  }
  function handleUpdateProfile(changes){mutate(s=>({...s,profile:{...s.profile,...changes}}));addToast('Profile saved');}
  function handleUpdateSettings(changes){mutate(s=>({...s,settings:{...s.settings,...changes}}));}
  async function handleChangePw(cur,next){return await changePassword(cur,next);}
  async function handleDeleteAcc(){const r=await deleteAccount();if(!r.success)addToast('Error',r.error,'');}

  const pageProps={state:userData,onNavigate:setPage};
  function renderPage(){
    if(page==='creator')return React.createElement(CreatorPage);
    switch(page){
      case 'home':return React.createElement(HomePage,{...pageProps,onToggleTask:handleToggleTask,onStartFocusTask:handleStartFocusTask});
      case 'focus':return React.createElement(FocusPage,{...pageProps,onSessionComplete:handleSessionComplete});
      case 'tasks':return React.createElement(TasksPage,{...pageProps,onAddTask:handleAddTask,onEditTask:handleEditTask,onDeleteTask:handleDeleteTask,onToggleTask:handleToggleTask,onStartFocusTask:handleStartFocusTask});
      case 'goals':return React.createElement(GoalsPage,{...pageProps,onAddGoal:handleAddGoal,onEditGoal:handleEditGoal,onDeleteGoal:handleDeleteGoal,onUpdateProgress:handleUpdateProgress,onToggleMilestone:handleToggleMilestone});
      case 'habits':return React.createElement(HabitsPage,{...pageProps,onToggleDay:handleToggleDay,onAddHabit:handleAddHabit,onDeleteHabit:handleDeleteHabit});
      case 'activity':return React.createElement(ActivityPage,{...pageProps});
      case 'analytics':return React.createElement(AnalyticsPage,{...pageProps});
      case 'achievements':return React.createElement(AchievementsPage,{...pageProps});
      case 'settings':return React.createElement(SettingsPage,{...pageProps,user,onUpdateProfile:handleUpdateProfile,onUpdateSettings:handleUpdateSettings,onChangePassword:handleChangePw,onDeleteAccount:handleDeleteAcc,onLogout});
      default:return null;
    }
  }
  return React.createElement(React.Fragment,null,
    React.createElement(Sidebar,{page,onNavigate:setPage,state:userData,mobileOpen,onCloseMobile:()=>setMobileOpen(false)}),
    React.createElement('div',{className:"main-content"},
      React.createElement(Topbar,{page,onOpenCmd:()=>setShowCmd(true),onNewTask:()=>setShowNewTask(true),onToggleMobile:()=>setMobileOpen(o=>!o)}),
      React.createElement('div',{className:"page-content"},renderPage())
    ),
    showCmd&&React.createElement(CommandPalette,{onClose:()=>setShowCmd(false),onNavigate:setPage,onNewTask:()=>setShowNewTask(true)}),
    showNewTask&&React.createElement(TaskModal,{task:null,onSave:form=>{handleAddTask(form);setShowNewTask(false);},onClose:()=>setShowNewTask(false)})
  );
}

// ============================================================
// ROOT — Auth-aware, data loading, no flash
// ============================================================
function Root(){
  const{user,signOut}=useAuth();
  const[authPage,setAuthPage]=useState('login');
  const[userData,setUserData]=useState(null);
  const[loading,setLoading]=useState(true);
  const{toasts,addToast}=useToasts();
  const unsubFsRef=useRef(null);

  useEffect(()=>{
    if(unsubFsRef.current){unsubFsRef.current();unsubFsRef.current=null;}
    if(!user){setUserData(null);setLoading(false);return;}
    // 1. Show localStorage immediately (no flash/blank)
    const cached=localLoad(user.uid);
    if(cached&&cached.profile){setUserData(cached);setLoading(false);}
    else setLoading(true);
    // 2. Load cloud in background
    cloudLoad(user.uid).then(cloud=>{
      if(cloud){
        // Cloud wins if newer; merge if timestamps equal
        const cloudTs=cloud._ts||0;const localTs=cached?cached._ts||0:0;
        const authoritative=cloudTs>=localTs?cloud:cached||cloud;
        setUserData(authoritative);localSave(user.uid,authoritative);
      }else if(cached&&cached.profile){
        cloudSave(user.uid,cached);// migrate local to cloud
      }else{
        const n=user.displayName||(user.email?user.email.split('@')[0]:'Student');
        const fresh=defaultUserData(n);fresh.createdAt=new Date().toISOString();
        setUserData(fresh);persistData(user.uid,fresh);
      }
      setLoading(false);
    }).catch(e=>{console.warn('Cloud load failed:',e.message);setLoading(false);});
    // 3. Real-time listener for cross-device sync
    if(_db){
      unsubFsRef.current=_db.collection('users').doc(user.uid).onSnapshot(snap=>{
        if(!snap.exists)return;const cd=snap.data();if(!cd)return;
        const cloudTs=cd._ts||0;
        setUserData(cur=>{
          const localTs=cur?cur._ts||0:0;
          if(cloudTs>localTs+5000){localSave(user.uid,cd);return cd;}
          return cur;
        });
      },err=>console.warn('Firestore listener:',err.message));
    }
    return()=>{if(unsubFsRef.current){unsubFsRef.current();unsubFsRef.current=null;}};
  },[user]);

  async function handleLogout(){
    if(unsubFsRef.current){unsubFsRef.current();unsubFsRef.current=null;}
    const uid=user?.uid;await signOut();setUserData(null);
    if(uid)try{localStorage.removeItem(LS_KEY(uid));}catch(e){}
    addToast('Signed out','See you next time');
  }

  // Loading
  if(user===undefined||loading){
    return React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--bg)',flexDirection:'column',gap:16}},
      React.createElement('div',{style:{width:36,height:36,border:'2.5px solid var(--border2)',borderTopColor:'var(--accent2)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}),
      React.createElement('div',{style:{fontSize:13,color:'var(--text3)'}},"Loading…"),
      React.createElement('style',{},"@keyframes spin{to{transform:rotate(360deg)}}")
    );
  }
  // Unauthenticated
  if(!user||!userData){
    return React.createElement('div',null,
      authPage==='login'&&React.createElement(LoginPage,{onNav:setAuthPage}),
      authPage==='signup'&&React.createElement(SignupPage,{onNav:setAuthPage}),
      authPage==='forgot'&&React.createElement(ForgotPage,{onNav:setAuthPage}),
      React.createElement(ToastContainer,{toasts})
    );
  }
  // Authenticated
  return React.createElement(React.Fragment,null,
    React.createElement(AppShell,{user,userData,setUserData,onLogout:handleLogout,addToast}),
    React.createElement(ToastContainer,{toasts})
  );
}

// ============================================================
// BOOTSTRAP
// ============================================================
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(AuthProvider,null,React.createElement(Root))
);
</script>
</body>
</html>
